<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Rust-Em</title>
    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@1,300&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .backdrop-blur-heavy { backdrop-filter: blur(40px) brightness(0.3); -webkit-backdrop-filter: blur(40px) brightness(0.3); }
        .media-card:hover .media-poster { transform: scale(1.05); }
        .media-card:hover { box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="bg-[#0f1115] text-gray-200 font-sans h-screen flex flex-col md:flex-row overflow-hidden">
    <div id="login-view" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0f1115] px-4">
        <div class="bg-[#1a1d24] p-8 rounded-2xl shadow-2xl w-full max-w-sm border border-gray-800">
            <h2 class="text-2xl mb-8 text-center font-bold text-white tracking-wider">RUST-EM</h2>
            <input id="username" type="text" placeholder="用户名" class="w-full p-3 mb-4 bg-[#0f1115] rounded-lg outline-none text-white border border-gray-700 focus:border-blue-500 transition-colors">
            <input id="password" type="password" placeholder="密码" class="w-full p-3 mb-6 bg-[#0f1115] rounded-lg outline-none text-white border border-gray-700 focus:border-blue-500 transition-colors">
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold text-white transition-colors">登录</button>
        </div>
    </div>

    <div id="main-view" class="hidden flex-1 flex flex-col md:flex-row h-full relative">
        <!-- PC 侧边栏 -->
        <div class="hidden md:flex w-64 bg-[#16191f] p-4 flex-col border-r border-gray-800 z-50 shrink-0">
            <h1 class="text-xl font-bold mb-8 text-blue-500 px-2 flex items-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Rust-Em
            </h1>
            <div class="text-xs text-gray-500 font-bold mb-3 px-2 uppercase tracking-wider">媒体库</div>
            <div id="sidebar-libs" class="flex flex-col gap-1 mb-6 overflow-y-auto"></div>
            <button onclick="switchTab('settings')" class="flex items-center gap-3 text-left px-3 py-2.5 hover:bg-gray-800 rounded-lg mb-2 transition mt-auto text-gray-400 hover:text-white">
                <span>⚙️</span> 系统设置
            </button>
            <button onclick="logout()" class="flex items-center gap-3 text-left px-3 py-2.5 text-red-400 hover:bg-gray-800 rounded-lg transition">
                <span>🚪</span> 退出登录
            </button>
        </div>

        <!-- 移动端顶栏 -->
        <div class="md:hidden bg-[#16191f] px-4 py-3 flex flex-col shadow-md z-10 sticky top-0 border-b border-gray-800 shrink-0">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-lg font-bold text-blue-500" id="mobile-title">媒体库</h1>
                <button onclick="switchTab('settings')" class="text-gray-400 text-sm">⚙️</button>
            </div>
            <div id="mobile-libs" class="flex overflow-x-auto gap-2 pb-1 no-scrollbar"></div>
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col h-full overflow-hidden bg-[#0f1115] relative">
            <div id="content-header" class="hidden p-4 md:px-8 md:pt-6 md:pb-2 shrink-0">
                <div class="flex gap-3">
                    <button onclick="setTypeFilter('all')" id="btn-type-all" class="px-5 py-1.5 rounded-full text-sm font-medium bg-blue-600 text-white transition shadow-lg shadow-blue-500/30">全部</button>
                    <button onclick="setTypeFilter('movies')" id="btn-type-movies" class="px-5 py-1.5 rounded-full text-sm font-medium bg-[#16191f] text-gray-400 hover:bg-gray-800 transition border border-gray-700">电影</button>
                    <button onclick="setTypeFilter('tvshows')" id="btn-type-tvshows" class="px-5 py-1.5 rounded-full text-sm font-medium bg-[#16191f] text-gray-400 hover:bg-gray-800 transition border border-gray-700">剧集</button>
                </div>
            </div>

            <div id="tab-library" class="hidden flex-1 overflow-y-auto p-4 md:px-8 md:py-4">
                <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6"></div>
            </div>

            <div id="tab-settings" class="hidden flex-1 overflow-y-auto p-4 md:px-8 md:py-6 pb-20">
                <div class="max-w-3xl mx-auto">
                    <h2 class="text-2xl font-bold mb-6">系统设置</h2>
                    <div class="bg-[#16191f] border border-gray-800 p-6 rounded-2xl shadow-lg mb-8">
                        <h3 class="text-lg font-bold mb-4 text-blue-400 border-b border-gray-800 pb-2">媒体库管理</h3>
                        <div id="settings-lib-list" class="flex flex-col gap-3 mb-6"></div>
                        <div class="border-t border-gray-800 pt-6">
                            <h4 class="font-bold text-gray-300 mb-4">添加新媒体库</h4>
                            <input id="lib-name" placeholder="媒体库名称" class="p-3 mb-3 bg-[#0f1115] border border-gray-700 rounded-lg w-full outline-none focus:border-blue-500 transition text-white">
                            <select id="lib-type" class="p-3 mb-4 bg-[#0f1115] border border-gray-700 rounded-lg w-full outline-none focus:border-blue-500 transition text-white">
                                <option value="movies">电影</option>
                                <option value="tvshows">电视剧</option>
                            </select>
                            <div class="mb-4">
                                <label class="block text-sm text-gray-400 mb-2">已选路径:</label>
                                <div id="selected-paths" class="flex flex-col gap-2 mb-3"></div>
                                <button onclick="openPathPicker()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2.5 rounded-lg text-sm transition w-full border border-gray-700 border-dashed text-gray-300">+ 浏览并添加路径</button>
                            </div>
                            <button onclick="addLibrary()" class="w-full bg-blue-600 hover:bg-blue-500 px-4 py-3 rounded-lg font-bold mt-2 transition text-white shadow-lg shadow-blue-500/20">保存并扫描</button>
                        </div>
                    </div>
                    <div class="bg-[#16191f] border border-gray-800 p-6 rounded-2xl shadow-lg mb-8">
                        <h3 class="text-lg font-bold mb-4 text-yellow-400 border-b border-gray-800 pb-2">修改管理员账号</h3>
                        <input id="old-pwd" type="password" placeholder="当前密码" class="p-3 mb-3 bg-[#0f1115] border border-gray-700 rounded-lg w-full outline-none focus:border-yellow-500 text-white">
                        <input id="new-user" type="text" placeholder="新用户名" class="p-3 mb-3 bg-[#0f1115] border border-gray-700 rounded-lg w-full outline-none focus:border-yellow-500 text-white">
                        <input id="new-pwd" type="password" placeholder="新密码" class="p-3 mb-4 bg-[#0f1115] border border-gray-700 rounded-lg w-full outline-none focus:border-yellow-500 text-white">
                        <button onclick="updateUser()" class="w-full bg-yellow-600 hover:bg-yellow-500 px-4 py-3 rounded-lg font-bold transition text-white shadow-lg shadow-yellow-500/20">更新账号</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 详情页 Modal：Web 端在右侧区域固定，移动端全屏 -->
        <div id="detail-modal" class="hidden fixed inset-0 md:left-64 z-40 overflow-y-auto bg-[#0b0e14]">
            <div id="detail-fanart" class="fixed inset-0 md:left-64 bg-cover bg-top backdrop-blur-heavy transition-opacity duration-500 opacity-40"></div>
            
            <div class="relative min-h-screen w-full p-4 md:p-8 flex flex-col">
                <!-- 关闭按钮 -->
                <button onclick="closeDetail()" class="fixed top-4 right-4 md:top-8 md:right-8 text-white bg-black/50 hover:bg-black/80 p-3 rounded-full z-50 backdrop-blur-md transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>

                <!-- 头部信息 -->
                <div class="flex flex-col md:flex-row gap-8 mt-12 md:mt-24 mb-10 z-10">
                    <div class="w-48 md:w-64 shrink-0 aspect-[2/3] bg-gray-800 rounded-xl overflow-hidden shadow-2xl border border-gray-600/50">
                        <img id="detail-poster" src="" class="w-full h-full object-cover" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMzAwIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iIzM3NDE1MSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LXNpemU9IjIwIiBmaWxsPSIjOWNhM2FmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+5rW35oqlPC90ZXh0Pjwvc3ZnPg=='">
                    </div>
                    
                    <div class="flex-1 flex flex-col justify-end pb-2">
                        <h1 id="detail-title" class="text-4xl md:text-6xl font-black text-white mb-2 tracking-tight drop-shadow-lg">影片标题</h1>
                        <div id="detail-tagline-box" class="hidden mb-6 mt-2"><div class="flex items-start gap-1 text-gray-300 text-lg md:text-xl" style="font-family: 'Merriweather', serif; font-style: italic;"><span class="text-3xl text-gray-500 leading-none mt-1">“</span><span id="detail-tagline" class="text-center px-2"></span><span class="text-3xl text-gray-500 leading-none mt-1 self-end">”</span></div></div>
                        
                        <div class="flex flex-wrap items-center gap-3 mb-6 text-sm font-medium">
                            <span id="detail-year" class="text-gray-300">2024</span>
                            <span class="text-gray-500">•</span>
                            <span class="text-yellow-400 font-bold flex items-center gap-1">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                <span id="detail-rating-val">0.0</span>
                            </span>
                            <span class="text-gray-500">•</span>
                            <span id="detail-runtime" class="text-gray-300"></span>
                            <span class="text-gray-500">•</span>
                            <span id="detail-mpaa" class="border border-gray-500 text-gray-300 px-2 py-0.5 rounded text-xs"></span>
                        </div>

                        <div class="flex gap-3 mb-6">
                            <button class="bg-white text-black hover:bg-gray-200 px-6 py-2 rounded-full font-bold flex items-center gap-2 transition">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                                播放
                            </button>
                            <button class="bg-gray-800/80 text-white hover:bg-gray-700 px-4 py-2 rounded-full font-bold flex items-center gap-2 transition border border-gray-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            </button>
                        </div>

                        <p id="detail-plot" class="text-gray-300 leading-relaxed text-sm md:text-base max-w-4xl line-clamp-4 hover:line-clamp-none transition-all cursor-pointer">暂无简介...</p>
                    </div>
                </div>

                <!-- 演职人员 -->
                <div class="mb-10 z-10">
                    <h3 class="text-sm text-gray-500 font-bold mb-4 uppercase tracking-wider">演职人员 CAST & CREW</h3>
                    <div id="detail-actors-list" class="flex gap-6 overflow-x-auto pb-4 no-scrollbar"></div>
                </div>

                <!-- 媒体文件区域 -->
                <div class="mb-20 z-10">
                    <h3 class="text-sm text-gray-500 font-bold mb-4 uppercase tracking-wider">媒体文件 MEDIA FILES</h3>
                    <div class="bg-[#16191f]/80 backdrop-blur-md border border-gray-800 rounded-xl p-5">
                        <div class="text-sm text-gray-400 mb-4 flex gap-4">
                            <span>文件大小: <span id="detail-file-size" class="text-gray-200">计算中...</span></span>
                            <span>容器格式: <span class="text-gray-200">STRM</span></span>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-[#0f1115] border border-gray-700 rounded-lg p-4">
                                <div class="text-xs text-blue-400 font-bold mb-2 uppercase">视频流 VIDEO</div>
                                <div class="text-sm text-gray-300 mb-1">等待媒体探测</div>
                                <div class="text-xs text-gray-500">探测后显示码率、帧率</div>
                            </div>
                            <div class="bg-[#0f1115] border border-gray-700 rounded-lg p-4">
                                <div class="text-xs text-green-400 font-bold mb-2 uppercase">音频流 AUDIO</div>
                                <div class="text-sm text-gray-300 mb-1">等待媒体探测</div>
                                <div class="text-xs text-gray-500">探测后显示声道、采样率</div>
                            </div>
                            <div class="bg-[#0f1115] border border-gray-700 rounded-lg p-4">
                                <div class="text-xs text-yellow-400 font-bold mb-2 uppercase">字幕流 SUBTITLE</div>
                                <div class="text-sm text-gray-300 mb-1">等待媒体探测</div>
                                <div class="text-xs text-gray-500">探测后显示语言、格式</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 路径选择弹窗 -->
    <div id="path-modal" class="hidden fixed inset-0 z-[60] bg-black/80 flex items-end md:items-center justify-center backdrop-blur-sm">
        <div class="bg-[#16191f] w-full md:w-2/3 lg:w-1/2 md:rounded-2xl rounded-t-2xl shadow-2xl flex flex-col h-[85vh] md:h-[75vh] border border-gray-700">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-[#1a1d24] rounded-t-2xl">
                <h3 class="font-bold truncate text-sm md:text-base text-blue-400" id="current-path">/media</h3>
                <button onclick="closePathPicker()" class="text-gray-400 hover:text-white px-2 text-xl">✕</button>
            </div>
            <div id="dir-list" class="flex-1 overflow-y-auto p-2"></div>
            <div class="p-4 border-t border-gray-800 flex gap-3 bg-[#1a1d24] rounded-b-2xl">
                <button onclick="selectCurrentPath()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-white transition">选中当前目录</button>
                <button onclick="closePathPicker()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-white transition">确认勾选</button>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let currentPath = '/media';
        let selectedPaths = [];
        let allLibraries = [];
        
        let currentLibId = 'all';
        let currentType = 'all';
        let cachedItems = [];

        const defaultPosterSvg = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMzAwIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iIzFhMWQyNCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LXNpemU9IjIwIiBmaWxsPSIjNGI1NTYzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+5rW35oqlPC90ZXh0Pjwvc3ZnPg==';

        if (token) showMain();

        async function api(path, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
            const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null });
            const text = await res.text();
            if (!res.ok) {
                if (res.status === 401) { logout(); }
                return { error: `HTTP ${res.status}: ${text || '无返回内容'}` };
            }
            if (!text) return {};
            return JSON.parse(text);
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            if (res.ok) {
                const data = await res.json();
                token = data.token; localStorage.setItem('token', token); showMain();
            } else alert('登录失败');
        }
        
        function logout() { localStorage.removeItem('token'); location.reload(); }
        
        async function showMain() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            await fetchLibraries();
            switchTab('library');
        }
        
        function switchTab(tab) {
            closeDetail();
            document.getElementById('tab-library').classList.add('hidden');
            document.getElementById('tab-settings').classList.add('hidden');
            document.getElementById('content-header').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            if (tab === 'library') {
                document.getElementById('content-header').classList.remove('hidden');
                loadMedia();
            } else if (tab === 'settings') {
                renderSettingsLibraries();
            }
        }

        async function fetchLibraries() {
            const data = await api('/api/libraries');
            if (data.libraries) {
                allLibraries = data.libraries;
                renderSidebarLibraries();
            }
        }

        function renderSidebarLibraries() {
            const desktopContainer = document.getElementById('sidebar-libs');
            const mobileContainer = document.getElementById('mobile-libs');
            let html = `<button onclick="setLibraryFilter('all')" class="flex items-center gap-3 text-left px-3 py-2.5 rounded-lg transition ${currentLibId === 'all' ? 'bg-gray-800 text-white font-medium shadow-sm' : 'hover:bg-gray-800/50 text-gray-400'}">全部媒体</button>`;
            allLibraries.forEach(lib => {
                const isActive = currentLibId === lib.id;
                const cls = isActive ? 'bg-gray-800 text-white font-medium shadow-sm' : 'hover:bg-gray-800/50 text-gray-400';
                const icon = lib.type === 'movies' ? '🎬' : '📺';
                html += `<button onclick="setLibraryFilter(${lib.id})" class="flex items-center gap-3 text-left px-3 py-2.5 rounded-lg transition truncate ${cls}"><span>${icon}</span> <span class="truncate">${lib.name}</span></button>`;
            });
            desktopContainer.innerHTML = html;
            let mobileHtml = `<button onclick="setLibraryFilter('all')" class="whitespace-nowrap px-4 py-1.5 rounded-full text-sm ${currentLibId === 'all' ? 'bg-blue-600 text-white' : 'bg-[#0f1115] text-gray-400 border border-gray-700'}">全部</button>`;
            allLibraries.forEach(lib => {
                const isActive = currentLibId === lib.id;
                const cls = isActive ? 'bg-blue-600 text-white' : 'bg-[#0f1115] text-gray-400 border border-gray-700';
                mobileHtml += `<button onclick="setLibraryFilter(${lib.id})" class="whitespace-nowrap px-4 py-1.5 rounded-full text-sm ${cls}">${lib.name}</button>`;
            });
            mobileContainer.innerHTML = mobileHtml;
        }

        function setLibraryFilter(libId) {
            closeDetail(); currentLibId = libId; renderSidebarLibraries(); switchTab('library'); }
        function setTypeFilter(type) {
            currentType = type;
            ['all', 'movies', 'tvshows'].forEach(t => {
                const btn = document.getElementById(`btn-type-${t}`);
                if (t === type) btn.className = 'px-5 py-1.5 rounded-full text-sm font-medium bg-blue-600 text-white transition shadow-lg shadow-blue-500/30';
                else btn.className = 'px-5 py-1.5 rounded-full text-sm font-medium bg-[#16191f] text-gray-400 hover:bg-gray-800 transition border border-gray-700';
            });
            loadMedia();
        }

        async function loadMedia() {
            try {
                let url = `/api/items?`;
                if (currentLibId !== 'all') url += `library_id=${currentLibId}&`;
                if (currentType !== 'all') url += `lib_type=${currentType}`;

                const grid = document.getElementById('media-grid');
                grid.innerHTML = Array(12).fill(`<div class="animate-pulse bg-[#16191f] rounded-xl overflow-hidden aspect-[2/3]"><div class="w-full h-full bg-gray-800/50"></div></div>`).join('');

                const data = await api(url);
                
                if (!data.items || data.items.length === 0) {
                    grid.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center text-gray-500 mt-20"><svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>该分类下暂无媒体内容</div>`;
                    cachedItems = [];
                    return;
                }
                
                cachedItems = data.items;

                grid.innerHTML = data.items.map(item => {
                    const imgUrl = item.has_poster ? `/api/images/${item.id}/poster?token=${token}` : defaultPosterSvg;
                    const ratingHtml = item.rating > 0 ? `<div class="absolute bottom-2 right-2 bg-yellow-500 text-black font-bold text-xs px-2 py-0.5 rounded shadow-lg border border-yellow-400">${item.rating.toFixed(1)}</div>` : '';
                    return `
                    <div onclick="openDetail(${item.id})" class="media-card bg-[#16191f] rounded-xl overflow-hidden cursor-pointer transition-all duration-300 hover:-translate-y-1 relative group border border-gray-800/50">
                        <div class="bg-gray-800 aspect-[2/3] overflow-hidden relative">
                            <img src="${imgUrl}" class="media-poster w-full h-full object-cover transition-transform duration-500" onerror="this.src='${defaultPosterSvg}'">
                            ${ratingHtml}
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        </div>
                        <div class="absolute bottom-0 w-full p-3 transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300 pointer-events-none">
                            <div class="font-bold text-white text-sm truncate drop-shadow-md">${item.title}</div>
                            <div class="text-xs text-gray-300 mt-1">${item.year || (item.type === 'movies' ? '电影' : '剧集')}</div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { console.error(e); }
        }

        function openDetail(itemId) {
            const item = cachedItems.find(i => i.id === itemId);
            if (!item) return;

            document.getElementById('detail-title').innerText = item.title;
            document.getElementById('detail-year').innerText = item.year || '未知年份';
            document.getElementById('detail-rating-val').innerText = item.rating > 0 ? item.rating.toFixed(1) : '暂无';
            document.getElementById('detail-plot').innerText = item.plot || '暂无简介。';
            
            if (item.runtime > 0) {
                const h = Math.floor(item.runtime / 60), m = item.runtime % 60;
                document.getElementById('detail-runtime').innerText = `${h > 0 ? h + 'h ' : ''}${m}min`;
            } else { document.getElementById('detail-runtime').innerText = '未知'; }

            const tagBox = document.getElementById('detail-tagline-box');
            if (item.tagline) { document.getElementById('detail-tagline').innerText = item.tagline; tagBox.classList.remove('hidden'); } else { tagBox.classList.add('hidden'); }
            const mpaaEl = document.getElementById('detail-mpaa');
            if (item.mpaa) { mpaaEl.innerText = item.mpaa; mpaaEl.classList.remove('hidden'); } else { mpaaEl.classList.add('hidden'); }

            const actorsContainer = document.getElementById('detail-actors-list');
            if (item.actors && item.actors.length > 0) {
                actorsContainer.innerHTML = item.actors.map(actor => {
                    const name = actor.name || '未知';
                    const role = actor.role || '';
                    return `
                    <div class="flex flex-col items-center shrink-0 w-20">
                        <div class="w-16 h-16 rounded-full bg-gray-800 border-2 border-gray-700 overflow-hidden flex items-center justify-center mb-2 shadow-md">
                            <span class="text-gray-400 text-xl font-bold">${name.charAt(0)}</span>
                        </div>
                        <div class="text-xs text-white text-center font-medium w-full truncate">${name}</div>
                        ${role ? `<div class="text-[10px] text-gray-400 text-center w-full truncate">${role}</div>` : ''}
                    </div>`;
                }).join('');
            } else {
                actorsContainer.innerHTML = `<div class="text-gray-500 text-sm">暂无演员信息</div>`;
            }

            const posterImg = document.getElementById('detail-poster');
            posterImg.src = item.has_poster ? `/api/images/${item.id}/poster?token=${token}` : defaultPosterSvg;

            const fanartDiv = document.getElementById('detail-fanart');
            if (item.has_poster) fanartDiv.style.backgroundImage = `url('/api/images/${item.id}/fanart?token=${token}')`;
            else fanartDiv.style.backgroundImage = 'none';

            const sizeEl = document.getElementById('detail-file-size');
            if (item.size > 0) { sizeEl.innerText = `${(item.size / (1024 * 1024 * 1024)).toFixed(2)} GB`; } else { sizeEl.innerText = '未知'; }

            document.getElementById('detail-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detail-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function renderSettingsLibraries() {
            const container = document.getElementById('settings-lib-list');
            if (allLibraries.length === 0) { container.innerHTML = `<div class="text-gray-500 text-sm py-2">暂无已添加的媒体库</div>`; return; }
            container.innerHTML = allLibraries.map(lib => `
                <div class="flex justify-between items-center bg-[#0f1115] border border-gray-800 p-3 rounded-xl">
                    <div class="flex items-center gap-3 truncate">
                        <span class="text-lg">${lib.type === 'movies' ? '🎬' : '📺'}</span>
                        <span class="font-medium text-gray-200">${lib.name}</span>
                        <span class="text-xs text-gray-500 bg-gray-800 px-2 py-0.5 rounded">${lib.type === 'movies' ? '电影' : '剧集'}</span>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="rescanLibrary(${lib.id})" class="text-blue-400 hover:text-blue-300 bg-blue-500/10 hover:bg-blue-500/20 px-3 py-1.5 rounded-lg text-sm transition border border-blue-500/20">刷新</button>
                        <button onclick="deleteLibrary(${lib.id}, '${lib.name}')" class="text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-3 py-1.5 rounded-lg text-sm transition border border-red-500/20">删除</button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteLibrary(id, name) {
            if (!confirm(`⚠️ 确定要删除媒体库【${name}】吗？`)) return;
            await api(`/api/libraries/${id}`, 'DELETE');
            await fetchLibraries(); renderSettingsLibraries();
        }

        async function rescanLibrary(id) {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = '扫描中...'; btn.disabled = true; btn.classList.add('opacity-50');
            await api(`/api/libraries/${id}/scan`, 'POST');
            setTimeout(() => {
                btn.innerText = originalText; btn.disabled = false; btn.classList.remove('opacity-50');
                alert('扫描任务已在后台启动，请稍后刷新列表查看。');
            }, 1000);
        }

        async function openPathPicker() { document.getElementById('path-modal').classList.remove('hidden'); await browseDir(currentPath); }
        function closePathPicker() { document.getElementById('path-modal').classList.add('hidden'); }

        async function browseDir(path) {
            const list = document.getElementById('dir-list');
            list.innerHTML = `<div class="p-4 text-center text-gray-500 animate-pulse">加载中...</div>`;
            const url = `/api/browse?path=${encodeURIComponent(path)}&t=${Date.now()}`;
            const res = await api(url, "GET");

            if (res.error) { list.innerHTML = `<div class="p-4 text-center text-red-400 text-sm font-bold bg-red-900/20 rounded-lg">读取失败: ${res.error}</div>`; return; }
            currentPath = res.current || path;
            document.getElementById('current-path').innerText = currentPath;
            list.innerHTML = '';

            if (currentPath !== '/media') {
                const parent = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/media';
                const backBtn = document.createElement('div');
                backBtn.className = "p-3 border-b border-gray-800 cursor-pointer hover:bg-gray-800 flex items-center text-gray-400 font-medium transition";
                backBtn.innerHTML = "⬅ 返回上一级";
                backBtn.onclick = () => browseDir(parent);
                list.appendChild(backBtn);
            }

            if (res.dirs && res.dirs.length > 0) {
                res.dirs.forEach(d => {
                    const row = document.createElement('div');
                    row.className = "p-3 border-b border-gray-800 flex justify-between items-center hover:bg-gray-800 cursor-pointer transition";
                    row.onclick = (e) => { if (e.target.tagName === 'INPUT') return; browseDir(d.path); };
                    const leftArea = document.createElement('div');
                    leftArea.className = "flex items-center flex-1 overflow-hidden pointer-events-none";
                    leftArea.innerHTML = `<span class="text-yellow-500 mr-3">📁</span> <span class="truncate">${d.name}</span>`;
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox'; checkbox.className = "w-5 h-5 accent-blue-500 cursor-pointer flex-shrink-0 ml-2";
                    checkbox.checked = selectedPaths.includes(d.path);
                    checkbox.onchange = (e) => togglePath(d.path, e.target.checked);
                    row.appendChild(leftArea); row.appendChild(checkbox); list.appendChild(row);
                });
            }

            if (res.files && res.files.length > 0) {
                res.files.forEach(f => {
                    const row = document.createElement('div');
                    row.className = "p-3 border-b border-gray-800 flex justify-between items-center hover:bg-gray-800 transition";
                    row.onclick = (e) => {
                        if (e.target.tagName === 'INPUT') return;
                        const cb = row.querySelector('input[type="checkbox"]');
                        cb.checked = !cb.checked; togglePath(f.path, cb.checked);
                    };
                    const leftArea = document.createElement('div');
                    leftArea.className = "flex items-center flex-1 overflow-hidden pointer-events-none text-gray-400";
                    leftArea.innerHTML = `<span class="text-blue-500 mr-3">📄</span> <span class="truncate">${f.name}</span>`;
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox'; checkbox.className = "w-5 h-5 accent-blue-500 cursor-pointer flex-shrink-0 ml-2";
                    checkbox.checked = selectedPaths.includes(f.path);
                    checkbox.onchange = (e) => togglePath(f.path, e.target.checked);
                    row.appendChild(leftArea); row.appendChild(checkbox); list.appendChild(row);
                });
            }
        }

        function togglePath(path, isChecked) {
            if (isChecked) { if (!selectedPaths.includes(path)) selectedPaths.push(path); }
            else { selectedPaths = selectedPaths.filter(p => p !== path); }
            renderSelectedPaths();
        }

        function selectCurrentPath() {
            if (!selectedPaths.includes(currentPath)) { selectedPaths.push(currentPath); renderSelectedPaths(); }
            closePathPicker();
        }

        function renderSelectedPaths() {
            const container = document.getElementById('selected-paths');
            if (selectedPaths.length === 0) { container.innerHTML = `<div class="text-gray-600 text-sm italic mb-2">暂未选择任何路径</div>`; return; }
            container.innerHTML = selectedPaths.map(p => `
                <div class="flex justify-between items-center bg-[#1a1d24] border border-gray-700 p-2.5 rounded-lg text-sm mb-2">
                    <span class="truncate mr-2 text-gray-300" title="${p}">${p}</span>
                    <button onclick="removePath('${p}')" class="text-red-400 hover:text-red-300 px-2 transition">移除</button>
                </div>
            `).join('');
        }

        function removePath(path) { selectedPaths = selectedPaths.filter(p => p !== path); renderSelectedPaths(); }

        async function addLibrary() {
            const name = document.getElementById('lib-name').value;
            const type = document.getElementById('lib-type').value;
            if (!name || selectedPaths.length === 0) return alert('请填写名称并至少选择一个路径');
            const res = await api('/api/libraries', 'POST', { name, paths: selectedPaths, type });
            if (res.error) return alert(res.error);
            alert('媒体库已保存，后台开始扫描。大目录可能需要一些时间，请稍后刷新。');
            selectedPaths = []; renderSelectedPaths(); document.getElementById('lib-name').value = '';
            await fetchLibraries(); renderSettingsLibraries(); switchTab('library');
        }

        async function updateUser() {
            const oldPwd = document.getElementById('old-pwd').value;
            const newUser = document.getElementById('new-user').value;
            const newPwd = document.getElementById('new-pwd').value;
            if (!oldPwd || !newUser || !newPwd) return alert('请填写完整所有选项');
            const res = await api('/api/user/update', 'POST', { old_password: oldPwd, new_username: newUser, new_password: newPwd });
            if (res && res.status === 'success') { alert('账号修改成功！请使用新账号重新登录。'); logout(); }
            else if (res && res.error) { alert(res.error); }
        }
    </script>
</body>
</html>
